<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>GURUHACK Punch Signal</title>
<style>
:root{
  --title:"GURUHACK";
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial Black,Impact,system-ui,sans-serif;background:#55aef7;color:white}
.app{position:relative;width:100vw;height:100dvh;min-height:640px;overflow:hidden;background:linear-gradient(#4da4f6 0%,#8ccafc 30%,#d9ecfb 52%,#f3f1ec 53%,#ece9e2 100%)}
.cloud{position:absolute;border-radius:999px;background:rgba(255,255,255,.55);filter:blur(.2px)}
.cloud:before,.cloud:after{content:"";position:absolute;border-radius:999px;background:inherit}.c1{width:170px;height:42px;top:108px;left:-28px}.c1:before{width:80px;height:80px;left:35px;top:-42px}.c1:after{width:85px;height:60px;left:88px;top:-25px}.c2{width:180px;height:44px;top:164px;right:-35px}.c2:before{width:92px;height:75px;left:15px;top:-44px}.c2:after{width:80px;height:55px;left:92px;top:-25px}
.header{position:absolute;top:12px;left:0;right:0;text-align:center;z-index:15;pointer-events:none}.title{display:inline-block;font-size:clamp(36px,9vw,76px);letter-spacing:1px;color:#fff;text-shadow:0 5px 0 #173958,0 0 4px #173958,-2px 0 #173958,2px 0 #173958,0 -2px #173958;line-height:.95}.title:after{content:var(--title)}
.hud{position:absolute;top:105px;left:4vw;right:4vw;z-index:20}.progress-line{position:absolute;top:26px;left:0;right:0;height:8px;background:#9ee9ff;border:2px solid rgba(255,255,255,.9);border-radius:999px;box-shadow:0 2px 0 rgba(0,0,0,.12)}.progress-fill{position:absolute;top:26px;left:0;height:8px;background:#50df18;border-radius:999px;transition:width .25s ease}.coef-strip{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:1.8vw;z-index:2}.coef{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}.pill{width:68px;max-width:17vw;height:34px;border-radius:25px;background:#eff3f7;border:4px solid #a9b3bc;box-shadow:0 4px 0 rgba(0,0,0,.2),inset 0 2px 0 #fff;display:flex;align-items:center;justify-content:space-around;padding:0 12px}.dot{width:9px;height:9px;background:#313438;border-radius:50%}.coef.done .pill{background:#57e610;border-color:#26a800}.coef.done .dot{background:#126c09}.coef-value{font-size:clamp(16px,3.9vw,30px);line-height:1;color:#fff;text-shadow:0 4px 0 #26313b,2px 0 #26313b,-2px 0 #26313b,0 -2px #26313b;white-space:nowrap}.coef.done .coef-value{color:#40e814;text-shadow:0 4px 0 #0e6d0a,2px 0 #0e6d0a,-2px 0 #0e6d0a,0 -2px #0e6d0a}
.floor{position:absolute;left:-24vw;right:-24vw;top:185px;bottom:-260px;z-index:1;overflow:hidden;perspective:720px}.floor-inner{position:absolute;inset:-40px -140px -260px;background-image:url('assets/tile-floor.png');background-size:30vw 24vw;background-repeat:repeat;transform-origin:50% 0%;transform:rotateX(60deg) scale(1.62);opacity:.98}.floor-fade{position:absolute;left:0;right:0;top:0;height:115px;background:linear-gradient(rgba(170,213,247,.86),rgba(217,236,251,.22),rgba(217,236,251,0))}
.stage{position:absolute;left:0;right:0;top:245px;bottom:295px;z-index:5;overflow:visible}.row{position:absolute;left:0;right:0;height:140px;display:grid;grid-template-columns:repeat(4,1fr);align-items:end;padding:0 7vw;column-gap:3.6vw}.row.r0{bottom:0;opacity:1;z-index:5}.row.r1{bottom:126px;opacity:.66;z-index:4;transform:scale(.66);transform-origin:50% 100%;filter:saturate(.85)}.row.r2{bottom:214px;opacity:.34;z-index:3;transform:scale(.46);transform-origin:50% 100%;filter:saturate(.65)}
.fighter{position:relative;width:100%;height:150px;display:flex;align-items:flex-end;justify-content:center}.man{position:relative;width:82px;height:140px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15))}.head{position:absolute;left:18px;top:0;width:52px;height:52px;background:#ffd936;border:2px solid #171717;border-radius:50%;z-index:3}.head:before,.head:after{content:"";position:absolute;top:18px;width:5px;height:7px;background:#161616;border-radius:50%}.head:before{left:16px}.head:after{right:16px}.mouth{position:absolute;left:18px;top:32px;width:17px;height:7px;border-bottom:4px solid #151515;border-radius:0 0 18px 18px}.brow{position:absolute;top:12px;width:12px;height:3px;background:#111}.b1{left:11px;transform:rotate(25deg)}.b2{right:11px;transform:rotate(-25deg)}.body{position:absolute;left:27px;top:49px;width:35px;height:53px;background:#ffdf39;border:2px solid #161616;border-radius:18px 18px 16px 16px;z-index:2}.arm,.leg{position:absolute;background:#ffdf39;border:2px solid #161616;border-radius:18px;transform-origin:50% 10%;z-index:1}.arm{width:16px;height:62px;top:52px}.leg{width:16px;height:61px;top:94px}.aL{left:16px;transform:rotate(45deg)}.aR{right:16px;transform:rotate(-45deg)}.lL{left:28px;transform:rotate(15deg)}.lR{right:28px;transform:rotate(-15deg)}.fist{position:absolute;width:18px;height:18px;background:#ffdf39;border:2px solid #111;border-radius:50%;bottom:-5px;left:-4px}.foot{position:absolute;width:29px;height:14px;background:#ffdf39;border:2px solid #111;border-radius:50%;bottom:-4px;left:-9px}.pose1 .aR{transform:rotate(-80deg);right:8px}.pose1 .aL{transform:rotate(25deg)}.pose1 .lL{transform:rotate(24deg)}.pose1 .lR{transform:rotate(-24deg)}.pose2 .aL{transform:rotate(88deg);left:5px}.pose2 .aR{transform:rotate(-18deg)}.pose2 .mouth{height:10px;border:4px solid #111;border-top:0;background:#fff}.pose3 .aL{transform:rotate(-55deg);left:20px}.pose3 .aR{transform:rotate(55deg);right:20px}.pose3 .b1{transform:rotate(-25deg)}.pose3 .b2{transform:rotate(25deg)}
.aim{position:absolute;width:78px;height:78px;background:url('assets/aim.png') center/contain no-repeat;z-index:30;display:none;pointer-events:none;transform:translate(-50%,-50%)}.aim.show{display:block;animation:pulse .55s ease-in-out infinite alternate}@keyframes pulse{to{transform:translate(-50%,-50%) scale(1.08)}}
.glove{position:absolute;right:7vw;bottom:calc(4px + var(--safe-bottom));width:150px;height:240px;background:url('assets/glove_user_clean.png?v=clean3') center/contain no-repeat;z-index:25;filter:drop-shadow(0 10px 0 rgba(0,0,0,.18));transition:transform .22s cubic-bezier(.2,.9,.2,1)}.glove:after{content:'SIGNAL';position:absolute;left:50%;top:47%;transform:translate(-50%,-50%) rotate(-10deg);font-size:22px;color:#ffe92a;text-shadow:0 3px 0 #131313,2px 0 #131313,-2px 0 #131313,0 -2px #131313;letter-spacing:.5px}.glove.punch{transition:transform .18s cubic-bezier(.12,.9,.2,1);transform:translate(var(--dx,0px),var(--dy,0px)) scale(.92) rotate(-18deg)}
.mode{position:absolute;left:5vw;bottom:calc(26px + var(--safe-bottom));z-index:30;width:235px;max-width:45vw;height:70px;border-radius:35px;background:#eef3f9;border:3px solid rgba(150,160,170,.45);display:grid;grid-template-columns:1fr 1fr;padding:5px;box-shadow:0 4px 0 rgba(0,0,0,.12)}.mode button{border:0;border-radius:30px;background:transparent;font-family:Arial Black,Impact,sans-serif;font-size:24px;color:#667386;text-shadow:0 1px #fff}.mode button.active{background:#51dc15;color:white;text-shadow:0 3px 0 #1b8210;box-shadow:inset 0 4px 0 rgba(255,255,255,.35),0 4px 0 #27a307}
.final{position:absolute;inset:0;z-index:60;background:linear-gradient(rgba(55,168,246,.1),rgba(255,255,255,.85));display:none;align-items:center;justify-content:center;flex-direction:column}.final.show{display:flex}.maxwin{font-size:clamp(58px,16vw,118px);color:#ffe100;text-shadow:0 8px 0 #8a3b00,4px 0 #461b00,-4px 0 #461b00,0 -4px #461b00;text-align:center}.hint{position:absolute;top:200px;left:50%;transform:translateX(-50%);font-size:13px;opacity:.001}
@media(max-height:720px){.hud{top:88px}.floor{top:175px;bottom:-260px}.floor-inner{background-size:30vw 24vw;transform:rotateX(60deg) scale(1.65)}.stage{top:225px;bottom:250px;overflow:visible}.row{height:112px}.row.r0{bottom:0}.row.r1{bottom:94px}.row.r2{bottom:158px}.man{transform:scale(.68);transform-origin:50% 100%}.glove{width:132px;height:205px}.mode{height:58px}.mode button{font-size:20px}}
@media(max-width:430px){.row{padding:0 5vw;column-gap:1.8vw}.man{transform:scale(.66);transform-origin:50% 100%}.glove{width:132px;height:205px}.mode{width:205px;height:62px}.mode button{font-size:21px}.hud{left:3vw;right:3vw}.coef-strip{gap:.7vw}.pill{width:56px;height:30px;padding:0 8px}.dot{width:6px;height:6px}.coef-value{font-size:16px}.floor-inner{background-size:34vw 26vw}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="cloud c1"></div><div class="cloud c2"></div>
  <div class="header"><div class="title" id="appTitle"></div></div>
  <div class="hud"><div class="progress-line"></div><div class="progress-fill" id="progressFill"></div><div class="coef-strip" id="coefStrip"></div></div>
  <div class="floor"><div class="floor-inner"></div><div class="floor-fade"></div></div>
  <div class="stage" id="stage"></div>
  <div class="aim" id="aim"></div>
  <div class="mode"><button id="easyBtn" class="active">EASY</button><button id="hardBtn">HARD</button></div>
  <div class="glove" id="glove"></div>
  <div class="final" id="final"><div class="maxwin">MAX WIN</div></div>
</div>
<script>
const APP_TITLE = 'GURUHACK'; // меняй название тут
const EASY = [1.25,1.67,2.22,2.97,3.96,5.28,7.04,9.38,12.51];
const HARD = [1.25,1.67,2.22,2.97,5.94,11.88,23.76,95.06,380.27];
let mode='easy', step=0, locked=false;
const stage=document.getElementById('stage'), strip=document.getElementById('coefStrip'), fill=document.getElementById('progressFill'), aim=document.getElementById('aim'), glove=document.getElementById('glove'), final=document.getElementById('final');
document.documentElement.style.setProperty('--title', JSON.stringify(APP_TITLE));
function coeffs(){return mode==='easy'?EASY:HARD}
function fmt(n){return 'X'+n.toFixed(2).replace(/\.00$/,'')}
function visibleStart(){return Math.max(0, Math.min(step-3, coeffs().length-5))}
function renderHud(){
  const arr=coeffs(), start=visibleStart(); strip.innerHTML='';
  for(let i=start;i<start+5;i++){
    const c=document.createElement('div'); c.className='coef '+(i<step?'done ':'')+(i===step?'active':'');
    c.innerHTML='<div class="pill"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div class="coef-value">'+fmt(arr[i])+'</div>';
    strip.appendChild(c);
  }
  // Прогресс привязан к отметке ПРОЙДЕННОГО коэффициента в видимой ленте.
  // Старт: вся шкала белая. После 1-го сигнала заливка до центра 1-го кэфа.
  const completedIndex = step - 1;
  let fillPercent = 0;
  if (step > 0) {
    const localIndex = Math.max(0, Math.min(4, completedIndex - start));
    fillPercent = step >= arr.length ? 100 : ((localIndex + 0.5) / 5) * 100;
  }
  fill.style.width = fillPercent + '%';
}
function manHTML(pose){return `<div class="man pose${pose}"><div class="head"><span class="brow b1"></span><span class="brow b2"></span><span class="mouth"></span></div><div class="body"></div><div class="arm aL"><span class="fist"></span></div><div class="arm aR"><span class="fist"></span></div><div class="leg lL"><span class="foot"></span></div><div class="leg lR"><span class="foot"></span></div></div>`}
function buildRows(){
  stage.innerHTML='';
  const leftRows = Math.max(0, 9 - step);
  const visibleRows = Math.min(3, leftRows);
  for(let r=0;r<visibleRows;r++){
    const row=document.createElement('div'); row.className='row r'+r;
    for(let i=0;i<4;i++){
      const f=document.createElement('div'); f.className='fighter'; f.dataset.row=r; f.dataset.col=i;
      f.innerHTML=manHTML(((step+r+i)%4)); row.appendChild(f);
    }
    stage.appendChild(row);
  }
}
function render(){renderHud(); buildRows(); aim.classList.remove('show'); final.classList.remove('show'); locked=false;}
function getTargetPoint(el){const r=el.getBoundingClientRect(); return {x:r.left+r.width/2, y:r.top+r.height*.52}}
function getGlovePoint(){const r=glove.getBoundingClientRect(); return {x:r.left+r.width*.48,y:r.top+r.height*.45}}
function signal(){
  if(locked || final.classList.contains('show')) return;
  locked=true;
  const fighters=[...document.querySelectorAll('.row.r0 .fighter')];
  const target=fighters[Math.floor(Math.random()*fighters.length)];
  const p=getTargetPoint(target);
  const g=getGlovePoint();

  aim.style.left=p.x+'px';
  aim.style.top=p.y+'px';
  aim.classList.add('show');

  glove.style.setProperty('--dx',(p.x-g.x)+'px');
  glove.style.setProperty('--dy',(p.y-g.y)+'px');
  glove.classList.add('punch');

  // шаг засчитывается сразу после нажатия, поэтому шкала заполняется уже с первого сигнала
  step++;
  renderHud();

  setTimeout(()=>glove.classList.remove('punch'),260);
  setTimeout(()=>{
    if(step>=9){
      aim.classList.remove('show');
      stage.innerHTML='';
      final.classList.add('show');
      locked=false;
      setTimeout(()=>{
        step=0;
        final.classList.remove('show');
        render();
      }, 1400);
    } else {
      aim.classList.remove('show');
      buildRows();
      locked=false;
    }
  },900);
}
glove.addEventListener('click',signal);
document.getElementById('easyBtn').onclick=()=>{mode='easy';step=0;document.getElementById('easyBtn').classList.add('active');document.getElementById('hardBtn').classList.remove('active');render()};
document.getElementById('hardBtn').onclick=()=>{mode='hard';step=0;document.getElementById('hardBtn').classList.add('active');document.getElementById('easyBtn').classList.remove('active');render()};
render();
</script>
</body>
</html>
